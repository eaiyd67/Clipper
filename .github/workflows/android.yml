name: Build ClipPulse APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Generate & Compile Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Generate Android Project via Python
        run: python3 build_project.py

      - name: Set Up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload ClipPulse APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipPulse-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
